{% macro key_field(prefix, field, caption, selected, name=none, wrap_id=none, detected=none) -%}
<div {% if wrap_id %}id="{{ wrap_id }}" {% endif %}class="min-w-0 flex-1">
  <div class="mb-1.5 flex min-h-5 items-center justify-between gap-2">
    <label for="{{ prefix }}{{ field }}_key_trigger" class="field-label">{{ caption }}</label>
    {% if detected %}
    <span id="{{ detected }}_detected_wrap" class="detected hidden items-center gap-1 truncate" aria-live="polite">
      <span id="{{ detected }}_detected_label"></span>
      <button type="button" id="{{ detected }}_detected_alt" class="detected-alt hidden"></button>
    </span>
    {% endif %}
  </div>
  <select id="{{ prefix }}{{ field }}_key" {% if name %}name="{{ name }}" required {% endif %}hidden aria-hidden="true"
    tabindex="-1">
    {% for key in keys %}<option value="{{ key }}" {% if key==selected %}selected{% endif %}>{{ key }}</option>{% endfor %}
    {% for key in german_keys %}<option value="{{ key }}">{{ key }}</option>{% endfor %}
  </select>
  <button type="button" id="{{ prefix }}{{ field }}_key_trigger" aria-haspopup="dialog" aria-expanded="false"
    class="key-trigger">
    <span id="{{ prefix }}{{ field }}_key_label" class="key-trigger-value">{{ selected }}</span>
    <svg viewBox="0 0 12 12" width="12" height="12" fill="none" aria-hidden="true">
      <path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>
</div>
{%- endmacro %}

{% macro swap_button(id) -%}
<button type="button" id="{{ id }}" aria-label="Swap keys" title="Swap keys" class="btn btn-square h-12 shrink-0">
  <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 7h12m0 0-3-3m3 3-3 3M16 13H4m0 0 3-3m-3 3 3 3" />
  </svg>
</button>
{%- endmacro %}

{% macro key_picker(prefix) -%}
<div class="relative">
  <div id="{{ prefix }}key_picker" role="dialog" aria-labelledby="{{ prefix }}key_picker_title"
    class="popover absolute inset-x-0 top-2 z-30 hidden p-3 sm:p-4">
    <div id="{{ prefix }}key_picker_title" class="text-sm font-semibold text-ink"></div>
  </div>
</div>
{%- endmacro %}
