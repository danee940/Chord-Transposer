<section aria-labelledby="linkhub-title" class="min-w-0 lg:sticky lg:top-8 lg:self-start">
  <h2 id="linkhub-title" class="text-[0.8125rem] font-semibold text-ink">Explore more transposers</h2>
  <div class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-1">
    {% for column in nav_columns %}
    <div class="space-y-6">
      {% for group in column %}
      <div>
        <h3 class="text-xs font-medium text-graphite">{{ group.heading }}</h3>
        <ul class="mt-2 space-y-1.5 border-l border-rule">
          {% for link in group.links %}
          <li>
            <a href="{{ link.path }}"
              class="-ml-px block border-l-2 py-0.5 pl-3 text-sm transition-colors{% if link.path == current_path %} border-vermilion font-semibold text-ink{% else %} border-transparent text-graphite hover:border-rule-strong hover:text-ink{% endif %}"
              {% if link.path == current_path %} aria-current="page" {% endif %}>{{ link.name }}</a>
          </li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</section>
