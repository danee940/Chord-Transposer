<header class="border-b border-rule">
  <div class="mx-auto flex h-14 w-full max-w-5xl items-center justify-between gap-4 px-4 sm:px-6">
    {% if current_path == "/" %}
    <h1 class="wordmark"><span class="wordmark-mark" aria-hidden="true"></span>Chord Transposer</h1>
    {% else %}
    <a href="/" class="wordmark"><span class="wordmark-mark" aria-hidden="true"></span>Chord Transposer</a>
    {% endif %}
    <div class="-mr-2 flex items-center gap-1 sm:gap-2">
      <div class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light theme"
          title="Light theme">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="10" cy="10" r="3.25" />
            <path
              d="M10 2.5v1.75M10 15.75v1.75M2.5 10h1.75M15.75 10h1.75M4.7 4.7l1.24 1.24M14.06 14.06l1.24 1.24M4.7 15.3l1.24-1.24M14.06 5.94l1.24-1.24" />
          </svg>
        </button>
        <button type="button" data-theme-choice="system" aria-pressed="false" aria-label="Match system theme"
          title="Match system theme">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"
            aria-hidden="true">
            <circle cx="10" cy="10" r="6.5" />
            <path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme"
          title="Dark theme">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M16.5 12.2A6.75 6.75 0 0 1 7.8 3.5a6.75 6.75 0 1 0 8.7 8.7z" />
          </svg>
        </button>
      </div>
      <nav aria-label="Project" class="flex items-center gap-1">
      <a href="https://github.com/danee940/Chord-Transposer" target="_blank" rel="noopener noreferrer"
        aria-label="View on GitHub" title="View on GitHub" class="nav-link">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
        </svg>
        <span class="hidden sm:inline">GitHub</span>
      </a>
      <a href="https://buymeacoffee.com/danee940" target="_blank" rel="noopener noreferrer" class="nav-link">
        <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 7.5h10v4.25a4.25 4.25 0 0 1-4.25 4.25h-1.5A4.25 4.25 0 0 1 3.5 11.75z" />
          <path d="M13.5 9h1.25a2 2 0 0 1 0 4H13.2" />
          <path d="M7 2.75c-.6.75.6 1.5 0 2.25M10 2.75c-.6.75.6 1.5 0 2.25" />
        </svg>
        <span class="hidden sm:inline">Buy me a coffee</span>
      </a>
      </nav>
    </div>
  </div>
</header>
