<article class="prose-section">
  <h2 class="section-title">Frequently asked questions</h2>
  <div class="mt-4 border-b border-rule">
    {% for item in faq_items %}
    <details class="group border-t border-rule">
      <summary
        class="flex cursor-pointer list-none items-center justify-between gap-4 py-4 text-[0.9375rem] font-medium text-ink hover:text-vermilion">
        {{ item.question }}
        <svg viewBox="0 0 12 12" width="12" height="12" fill="none" aria-hidden="true"
          class="shrink-0 text-graphite transition-transform duration-200 group-open:rotate-45">
          <path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </summary>
      <p class="-mt-1 pb-4 pr-8">
        {{ item.answer }}
      </p>
    </details>
    {% endfor %}
  </div>
</article>
