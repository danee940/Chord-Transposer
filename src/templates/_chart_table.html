<div class="overflow-x-auto rounded-sheet border border-rule bg-paper">
  <table class="data-table text-center">
    <thead>
      <tr>
        <th scope="col" class="sticky left-0 z-10 bg-paper text-left">Note</th>
        {% for header in chart.headers %}
        <th scope="col">{{ header }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in chart.rows %}
      <tr>
        <th scope="row" class="sticky left-0 z-10 bg-paper text-left font-mono font-semibold">{{ row.note }}</th>
        {% for cell in row.cells %}
        <td class="font-mono">{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
