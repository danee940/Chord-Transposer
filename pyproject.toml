[project]
name = "chord-transposer"
version = "1.0.0"
description = "Web app for transposing .docx chord sheets between musical keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ANN"]

[tool.pylint.main]
# Pylint is a light, errors-only safety net; style and typing are enforced by
# ruff (incl. ANN annotation rules) and pyright strict.
disable = ["all"]
enable = ["E"]

[tool.pytest.ini_options]
addopts = "--cov=transpose --cov=app --cov=seo --cov-report=term-missing --cov-fail-under=95"
testpaths = [
    "src/test_transpose.py",
    "src/test_app.py",
    "src/test_integration.py",
    "src/test_parity.py",
    "src/test_api_contract.py",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["transpose", "app", "seo"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
